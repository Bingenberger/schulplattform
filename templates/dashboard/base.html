<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Schulplattform{% endblock %}</title>
<style>
:root{font-family:system-ui,sans-serif;color:#172d38;background:#f3f6f7}
body{margin:0}header{background:#153d4a;color:white;padding:1.2rem max(1rem,calc((100% - 68rem)/2))}
header a{color:white}nav{display:flex;gap:1.3rem;align-items:center;flex-wrap:wrap}
main{max-width:68rem;margin:2rem auto;padding:0 1rem}h1{font-size:2rem}h2{font-size:1.3rem}
a{color:#125d74}section,.tile{background:white;border:1px solid #d6e0e4;border-radius:.7rem;padding:1.3rem;margin:1rem 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(16rem,1fr));gap:1rem}
label{display:block;margin:.9rem 0}input{display:block;padding:.7rem;max-width:24rem;width:90%;border:1px solid #9aafb8;border-radius:.3rem;font:inherit}
button{padding:.65rem 1rem;border:0;border-radius:.3rem;background:#175b70;color:white;cursor:pointer;font:inherit}
button.secondary{background:#52646c}form.inline{display:inline-block;margin:.4rem .5rem .4rem 0}
.error{color:#9c2d2d}small,.muted{color:#52646c}table{border-collapse:collapse;width:100%;background:white}
th,td{text-align:left;border-bottom:1px solid #d6e0e4;padding:.7rem;vertical-align:top}code{overflow-wrap:anywhere}
.badge{display:inline-block;padding:.15rem .55rem;border-radius:1rem;font-size:.85rem;background:#e2e8eb}
.ok{background:#d8efe0;color:#1c5a33}.warn{background:#fbedd0;color:#6b4a07}.bad{background:#f6d9d9;color:#7d2323}
.notice{border-left:4px solid #175b70;padding:.6rem 1rem;background:#eef5f7;margin:1rem 0}
.notice.error{border-color:#9c2d2d;background:#fbeeee}select{padding:.6rem;font:inherit}
.table-wrap{overflow-x:auto}nav.sub{gap:1rem;margin:.5rem 0 1rem}
</style>
</head>
<body>
<header><nav><strong>Schulplattform</strong><a href="{{ url_for('tiles') }}">Apps</a>
{% if g.admin %}<a href="{{ url_for('admin') }}">Administration</a><a href="{{ url_for('domains') }}">Domains</a>
<a href="{{ url_for('certificates') }}">Zertifikate</a><a href="{{ url_for('mail') }}">Mail</a>
<a href="{{ url_for('backups') }}">Sicherungen</a><a href="{{ url_for('updates') }}">Updates</a>
<form class="inline" method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ csrf() }}"><button>Abmelden</button></form>
{% else %}<a href="{{ url_for('login') }}">Administration anmelden</a>{% endif %}
</nav></header>
<main>{% block body %}{% endblock %}</main>
</body></html>
