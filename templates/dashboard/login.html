{% extends "base.html" %}{% block title %}Administration anmelden{% endblock %}
{% block body %}<section><h1>Administration anmelden</h1>
<p>Mit deinem eigenen Plattformkonto und dem Code aus deiner Authenticator-App.</p>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post"><input type="hidden" name="csrf" value="{{ csrf() }}">
<label>Benutzername<input name="username" autocomplete="username" required maxlength="80"></label>
<label>Passwort<input type="password" name="password" autocomplete="current-password" required maxlength="256"></label>
<label>Authenticator-Code<input name="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" required maxlength="6"></label>
<button>Anmelden</button></form></section>{% endblock %}
