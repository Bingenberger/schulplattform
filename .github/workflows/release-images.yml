# Publishes the platform's own amd64 images (dashboard, mail relay) for version
# tags with SBOM and provenance. Uses only the runner's Docker CLI.
name: Release platform images

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout tagged commit
        run: |
          set -eu
          git init -q src
          git -C src fetch -q --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "${GITHUB_SHA}"
          git -C src checkout -q FETCH_HEAD
      - name: Test
        run: |
          set -eu
          cd src
          python3 -m venv .venv
          .venv/bin/pip install -q --require-hashes -r requirements-dashboard.lock
          .venv/bin/pip install -q -r requirements-dev.txt
          .venv/bin/python -m pytest -q tests
      - name: Build and publish
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          cd src
          version="${GITHUB_REF_NAME#v}"
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          printf '%s' "${REGISTRY_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker buildx create --use --name release --driver docker-container >/dev/null
          : > ../digests.txt
          for entry in schulplattform-dashboard=Dockerfile.dashboard:. schulplattform-relay=relay/Dockerfile:relay; do
            name="${entry%%=*}"; spec="${entry#*=}"; file="${spec%%:*}"; context="${spec#*:}"
            docker buildx build --platform linux/amd64 --provenance=mode=max --sbom=true \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --label "org.opencontainers.image.version=${version}" \
              --tag "ghcr.io/${owner}/${name}:${version}" -f "${file}" \
              --metadata-file "../meta-${name}.json" --push "${context}"
            digest="$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["containerimage.digest"])' "../meta-${name}.json")"
            printf 'ghcr.io/%s/%s:%s@%s\n' "${owner}" "${name}" "${version}" "${digest}" >> ../digests.txt
          done
          { echo '### Published images'; echo; echo '```'; cat ../digests.txt; echo '```'; } >> "${GITHUB_STEP_SUMMARY}"
          docker logout ghcr.io
