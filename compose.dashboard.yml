# Local dashboard profile. The platform proxy override removes the loopback port.
services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    image: schulplattform-dashboard:0.1.0-dev
    user: "10001:10001"
    group_add: ["${SP_MANAGEMENT_GID:?management socket group required}"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=64m,mode=1777"]
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 128
    environment:
      SP_DASHBOARD_STATE: /state
      SP_DEPLOYMENT_SOCKET: /run/management/deploy.sock
      SP_DEPLOYMENT_KEY_FILE: /run/secrets/deployment_key
      SP_APP_CATALOGUE: /config/apps.json
      SP_DASHBOARD_HOSTS: ${SP_DASHBOARD_HOSTS:?explicit dashboard hostname required}
    secrets: [deployment_key]
    volumes:
      - dashboard-state:/state
      - ${SP_MANAGEMENT_SOCKET_DIR:?socket directory required}:/run/management:ro
      - ${SP_APP_CATALOGUE_FILE:?app catalogue required}:/config/apps.json:ro
    ports: ["127.0.0.1:${SP_DASHBOARD_PORT:-8090}:8000"]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
secrets:
  deployment_key:
    file: ${SP_DEPLOYMENT_KEY_FILE:?credential file required}
volumes:
  dashboard-state:
