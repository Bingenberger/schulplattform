services:
  app:
    image: abgen:0.1.0-dev
    build: {context: ., target: runtime}
    user: "10001:10001"
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=64m,mode=1777"]
    mem_limit: 1024m
    cpus: 1
    pids_limit: 128
    stop_grace_period: 45s
    networks:
      default:
        aliases: [abgen-web]
    ports: ["127.0.0.1:${WEB_PORT:-8080}:3000"]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      STORAGE: postgres
      DATABASE_URL_FILE: /run/secrets/database_url
      ASSET_DIR: /app/data/assets
      WEB_ORIGIN: "${WEB_ORIGIN:-http://localhost:8080}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      ALLOW_REGISTRATION: "${ALLOW_REGISTRATION:-false}"
      INTERNAL_WEB_ORIGIN: http://abgen-web:3000
      PDF_SERVICE_URL: http://pdf:3001
      LOG_LEVEL: warn
    secrets: [database_url]
    volumes: [assets:/app/data/assets]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: &logging
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  pdf:
    image: abgen-pdf:0.1.0-dev
    build: {context: ., target: pdf}
    user: "10001:10001"
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=256m,mode=1777", "/home/abgen:size=32m,uid=10001,gid=10001,mode=700"]
    mem_limit: 1536m
    cpus: 2
    pids_limit: 384
    stop_grace_period: 55s
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3001"
      WEB_ORIGIN: http://abgen-web:3000
      LOG_LEVEL: warn
      XDG_CACHE_HOME: /tmp/cache
      XDG_CONFIG_HOME: /tmp/config
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *logging
  postgres:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin
    secrets: [db_admin, db_app]
    volumes: [postgres:/var/lib/postgresql, ./docker/init-postgres.sh:/docker-entrypoint-initdb.d/01-app.sh:ro]
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *logging
volumes:
  assets:
  postgres:
secrets:
  db_admin:
    file: ${ABGEN_SECRETS_DIR:?Run prepare_secrets.py and set ABGEN_SECRETS_DIR}/db-admin
  db_app:
    file: ${ABGEN_SECRETS_DIR:?Run prepare_secrets.py and set ABGEN_SECRETS_DIR}/db-app
  database_url:
    file: ${ABGEN_SECRETS_DIR:?Run prepare_secrets.py and set ABGEN_SECRETS_DIR}/database-url
